name: MDscope checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdscope-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shell syntax and compile analysis modules
        run: |
          # bash -n checks only its first file argument, so loop.
          git ls-files -z '*.sh' | while IFS= read -r -d '' script; do
            bash -n "$script"
          done
          python -m compileall -q src tests
      - name: ShellCheck tracked shell scripts
        if: matrix.python-version == '3.11'
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Ruff (blocking fatal rules; pyflakes advisory until cleanup)
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install ruff==0.17.6
          ruff check --output-format github src tests scripts
          ruff check --select F --exit-zero --output-format github src tests scripts
      - name: Install dependencies for synthetic tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,studio]" build twine
      - name: Install real FreeSASA for analytic geometry references
        if: matrix.python-version == '3.11'
        run: python -m pip install freesasa
      - name: Record tested environment
        run: |
          mkdir -p /tmp/mdscope-env
          python -m pip freeze --exclude-editable > "/tmp/mdscope-env/pip-freeze-py${{ matrix.python-version }}.txt"
      - name: Publish tested environment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdscope-tested-env-py${{ matrix.python-version }}
          path: /tmp/mdscope-env/
          retention-days: 30
      - name: Build and validate distribution metadata
        if: matrix.python-version == '3.11'
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import tarfile
          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              assert any(n.endswith("mdscope/studio/assets/MM+Lab+Logo.png") for n in archive.namelist())
          with tarfile.open(sdist) as archive:
              assert any(n.endswith("mdscope/studio/assets/MM+Lab+Logo.png") for n in archive.getnames())
          PY
          {
            echo "### Built distributions"
            echo "Source commit: \`$(git rev-parse HEAD)\`"
            (cd dist && sha256sum ./*) | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify installed package and CLI
        run: |
          cd /tmp
          python -c "import mdscope; import mdscope.cli; print(mdscope.__version__)"
          mdscope --help
      - name: Verify wheel and sdist in isolated installations
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/mdscope-wheel
          /tmp/mdscope-wheel/bin/pip install "dist/$(basename "$(ls dist/*.whl)")"[studio]
          (cd /tmp && /tmp/mdscope-wheel/bin/python -c "import mdscope, mdscope.statistics, mdscope.interactions, mdscope.mechanisms, mdscope.pipeline; print(mdscope.__version__)")
          (cd /tmp && /tmp/mdscope-wheel/bin/mdscope --help)
          (cd /tmp && /tmp/mdscope-wheel/bin/python -c "from importlib.resources import files; assert (files('mdscope.studio') / 'assets' / 'MM+Lab+Logo.png').is_file()")
          (cd /tmp && /tmp/mdscope-wheel/bin/python -c "from streamlit.testing.v1 import AppTest; from importlib.resources import files; test = AppTest.from_file(str(files('mdscope.studio') / 'app.py')).run(timeout=30); assert not test.exception, test.exception")
          # Wheel metadata, package __version__, CLI and CITATION.cff must agree.
          expected=$(/tmp/mdscope-wheel/bin/python -c "import mdscope; print(mdscope.__version__)")
          test "$(cd /tmp && /tmp/mdscope-wheel/bin/mdscope --version)" = "mdscope ${expected}"
          test "$(/tmp/mdscope-wheel/bin/python -c "from importlib.metadata import version; print(version('mdscope'))")" = "${expected}"
          grep -qx "version: ${expected}" CITATION.cff
          echo "Installed wheel: mdscope ${expected} from $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          python -m venv /tmp/mdscope-sdist
          /tmp/mdscope-sdist/bin/pip install dist/*.tar.gz
          (cd /tmp && /tmp/mdscope-sdist/bin/python -c "import mdscope.cli, mdscope.pipeline.runner")
      - name: Run synthetic regression tests
        if: matrix.python-version != '3.11'
        run: |
          pytest -q --durations=20 tests
      - name: Run synthetic regression tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install pytest-cov
          # Coverage is visibility only: no minimum. CLI subprocess tests
          # are not measured, so CLI modules are under-reported.
          pytest -q --durations=20 --cov=mdscope --cov-report=term             --cov-report=xml:/tmp/mdscope-coverage/coverage.xml             --cov-report=html:/tmp/mdscope-coverage/html tests
      - name: Publish coverage report
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdscope-coverage
          path: /tmp/mdscope-coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Generate current static architecture graphs
        if: matrix.python-version == '3.11'
        run: |
          python scripts/architecture_map.py --output /tmp/mdscope-architecture
          # Graphviz is optional. The DOT and JSON files always remain usable.
          if command -v dot >/dev/null 2>&1; then
            dot -Tsvg /tmp/mdscope-architecture/modules.dot -o /tmp/mdscope-architecture/modules.svg
            dot -Tsvg /tmp/mdscope-architecture/calls.dot -o /tmp/mdscope-architecture/calls.svg
          fi
      - name: Publish architecture review artifact
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdscope-architecture-map
          path: /tmp/mdscope-architecture/
          if-no-files-found: warn
          retention-days: 14
      - name: Profile representative numerical kernels (manual only)
        if: github.event_name == 'workflow_dispatch' && matrix.python-version == '3.11'
        run: |
          pytest -q -s -m benchmark tests/test_performance_benchmarks.py

  minimum-dependencies:
    # Lowest declared versions of direct runtime dependencies (pyproject floors).
    name: python-checks (3.11, minimum dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install MDscope at its declared minimum versions
        run: |
          python -m pip install uv==0.10.8
          # lowest-direct pins MDscope's own requirements to their floors;
          # test tooling is installed afterwards at current versions.
          uv pip install --system --resolution lowest-direct -e .
          uv pip install --system pytest "streamlit>=1.40,<2"
          mkdir -p /tmp/mdscope-env
          python -m pip freeze --exclude-editable | tee /tmp/mdscope-env/pip-freeze-py3.11-minimum.txt
      - name: Publish tested minimum environment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdscope-tested-env-py3.11-minimum
          path: /tmp/mdscope-env/
          retention-days: 30
      - name: Run synthetic regression tests at minimum versions
        run: pytest -q --durations=20 tests
