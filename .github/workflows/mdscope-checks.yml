name: MDscope checks
on:
  push:
    branches:
      - main
      - feature/neuronal-membrane-mechanisms
      - fix/scientific-data-integrity-20261028
      - recovery/missing-refactors-20261029
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shell syntax and compile analysis modules
        run: |
          bash -n run_mdscope.sh finalize_mdscope.sh
          python -m compileall -q src tests
      - name: Install dependencies for synthetic tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build twine
      - name: Install real FreeSASA for analytic geometry references
        if: matrix.python-version == '3.11'
        run: python -m pip install freesasa
      - name: Build and validate distribution metadata
        if: matrix.python-version == '3.11'
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify installed package and CLI
        run: |
          cd /tmp
          python -c "import mdscope; import mdscope.cli; print(mdscope.__version__)"
          mdscope --help
      - name: Verify wheel and sdist in isolated installations
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/mdscope-wheel
          /tmp/mdscope-wheel/bin/pip install dist/*.whl
          (cd /tmp && /tmp/mdscope-wheel/bin/python -c "import mdscope, mdscope.statistics, mdscope.interactions, mdscope.mechanisms, mdscope.pipeline; print(mdscope.__version__)")
          (cd /tmp && /tmp/mdscope-wheel/bin/mdscope --help)
          python -m venv /tmp/mdscope-sdist
          /tmp/mdscope-sdist/bin/pip install dist/*.tar.gz
          (cd /tmp && /tmp/mdscope-sdist/bin/python -c "import mdscope.cli, mdscope.pipeline.runner")
      - name: Run synthetic regression tests
        run: |
          pytest -q --durations=20 tests
      - name: Profile representative numerical kernels (manual only)
        if: github.event_name == 'workflow_dispatch' && matrix.python-version == '3.11'
        run: |
          pytest -q -s -m benchmark tests/test_performance_benchmarks.py

