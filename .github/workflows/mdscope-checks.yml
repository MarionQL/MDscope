name: MDscope checks
on:
  push:
    branches:
      - feature/neuronal-membrane-mechanisms
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile every analysis module
        run: python -m compileall -q analysis tests
      - name: Install dependencies for synthetic tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow pyyaml matplotlib MDAnalysis pytest
      - name: Run synthetic regression tests
        run: |
          mkdir -p _ci_alias
          ln -s "$PWD" _ci_alias/mdscope
          PYTHONPATH="$PWD/_ci_alias" pytest -q tests
