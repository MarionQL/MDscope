name: MDscope checks
on:
  push:
    branches:
      - main
      - feature/neuronal-membrane-mechanisms
      - fix/scientific-data-integrity-20261028
      - refactor/installable-package-boundaries-20261028
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shell syntax and compile analysis modules
        run: |
          bash -n run_mdscope.sh finalize_mdscope.sh
          python -m compileall -q analysis tests
      - name: Install dependencies for synthetic tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build twine
      - name: Build and validate distribution metadata
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify installed package and CLI
        run: |
          cd /tmp
          python -c "import mdscope; import mdscope.analysis.cli; print(mdscope.__version__)"
          mdscope --help
      - name: Run synthetic regression tests
        run: |
          mkdir -p _ci_alias
          ln -s "$PWD" _ci_alias/mdscope
          PYTHONPATH="$PWD/_ci_alias" pytest -q tests
      - name: Profile representative numerical kernels
        run: |
          PYTHONPATH="$PWD/_ci_alias" pytest -q -s tests/test_performance_benchmarks.py
