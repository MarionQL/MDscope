name: MDscope checks
on:
  push:
    branches:
      - main
      - feature/neuronal-membrane-mechanisms
      - fix/scientific-data-integrity-20261028
      - recovery/missing-refactors-20261029
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check shell syntax and compile analysis modules
        run: |
          bash -n run_mdscope.sh finalize_mdscope.sh
          python -m compileall -q src tests
      - name: Install dependencies for synthetic tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build twine
      - name: Build and validate distribution metadata
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify installed package and CLI
        run: |
          cd /tmp
          python -c "import mdscope; import mdscope.analysis.cli; print(mdscope.__version__)"
          mdscope --help
      - name: Verify wheel and sdist in isolated installations
        run: |
          python -m venv /tmp/mdscope-wheel
          /tmp/mdscope-wheel/bin/pip install dist/*.whl
          (cd /tmp && /tmp/mdscope-wheel/bin/python -c "import mdscope, mdscope.analysis.statistics, mdscope.analysis.interactions, mdscope.analysis.mechanisms, mdscope.analysis.pipeline; print(mdscope.__version__)")
          (cd /tmp && /tmp/mdscope-wheel/bin/mdscope --help)
          python -m venv /tmp/mdscope-sdist
          /tmp/mdscope-sdist/bin/pip install dist/*.tar.gz
          (cd /tmp && /tmp/mdscope-sdist/bin/python -c "import mdscope.analysis.cli, mdscope.analysis.pipeline.runner")
      - name: Run synthetic regression tests
        run: |
          pytest -q tests
      - name: Profile representative numerical kernels
        run: |
          pytest -q -s tests/test_performance_benchmarks.py
