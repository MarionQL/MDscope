name: MDscope real GROMACS trajectory smoke test

# Opt-in: release downloads are ~1.6 GB. Do not run on every ordinary PR.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/real_trajectory_smoke.py"
      - "tests/real_sdc4_mechanisms.py"
      - "tests/real_hs_topology_audit.py"
      - "tests/real_full_config_validate.py"
      - "src/mdscope/**"
      - "synd4_full_mechanisms.yaml"
      - "tests/real_trajectory_physics.py"
      - ".github/workflows/real-trajectory-smoke.yml"

concurrency:
  group: real-trajectory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-trajectory-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      MDSCOPE_REAL_DATA: real_test_data
      MDSCOPE_REAL_OUTPUT: real_test_results
      MDSCOPE_PROFILE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MDscope analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Download paired real trajectories and TPR files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p real_test_data
          gh release download test-data-v1 --repo MarionQL/MDscope --dir real_test_data
          ls -lh real_test_data
          df -h .
      - name: Audit HS topology chain IDs and covalent attachment sites
        run: |
          python tests/real_hs_topology_audit.py
      - name: Validate full production YAML selections on both real topologies
        run: |
          python tests/real_full_config_validate.py
      - name: Run real-trajectory analysis on both systems
        run: |
          python tests/real_trajectory_smoke.py
      - name: Validate SDC4 geometry and lipid maps on real TPR/XTC inputs
        run: |
          python tests/real_sdc4_mechanisms.py
      - name: Full-length physical audit and stage benchmarks
        run: |
          python tests/real_trajectory_physics.py
      - name: Upload diagnostic reports and sample output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdscope-real-trajectory-smoke
          path: |
            real_test_results/**/smoke_report.json
            real_test_results/*/*/rep1/stage_timings.json
            real_test_results/*/*/rep1/streaming_phase_profile.json
            real_test_results/*/*/rep1/fused_membrane_timings.json
            real_test_results/*/*/rep1/fused_extensions_timings.json
            real_test_results/*/*/rep1/fused_distance_timings.json
            real_test_results/physical_audit.json
            real_test_results/*/physics/geometry_per_frame.parquet
            real_test_results/*/physics/changed_lipid_orientation.parquet
            real_test_results/*/physics/interactions/lipid_hydrogen_bonds/*.parquet
            real_test_results/*.yaml
            real_test_results/*/*/rep1/summary/*.parquet
            real_test_results/sdc4_mechanisms_smoke/*/extensions/sdc4_mechanisms/*.parquet
            real_test_results/sdc4_mechanisms_smoke/*/extensions/sdc4_mechanisms/*.json
            real_test_results/*/*/rep1/extensions/*/timeseries.parquet
            real_test_results/*/*/rep1/interactions/lipid_hydrogen_bonds/count_timeseries.parquet
          if-no-files-found: warn
          retention-days: 7
