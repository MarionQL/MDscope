name: MDscope figure review

# Dispatch when required by docs/developer/check-policy.md.
on:
  pull_request:
    paths:
      - 'src/mdscope/reporting/**'
      - 'src/mdscope/contracts/plot_validation.py'
      - 'src/mdscope/planning.py'
      - 'src/mdscope/registry.py'
      - 'src/mdscope/config/**'
      - 'src/mdscope/studio/**'
      - 'scripts/*preview*.py'
      - 'scripts/figure_gallery.py'
      - '.github/workflows/figure-review.yml'
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Previous-code commit, branch or tag (default: merge base with main)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  before-after-plots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install MDscope rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' Pillow
      - name: Resolve comparison base
        id: base
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          if [[ -n "$BASE_REF" ]]; then
            base_sha=$(git rev-parse --verify --quiet "${BASE_REF}^{commit}" \
              || git rev-parse --verify --quiet "origin/${BASE_REF}^{commit}") || {
              echo "::error::base_ref '${BASE_REF}' is not a commit, branch or tag in this repository"
              exit 1
            }
            described="$BASE_REF"
          else
            base_sha=$(git merge-base HEAD origin/main) || {
              echo "::error::no merge base between ${GITHUB_REF_NAME} and origin/main; set base_ref"
              exit 1
            }
            described="merge base with main"
          fi
          if [[ "$base_sha" == "$head_sha" ]]; then
            echo "::notice::Base equals head (${head_sha}); figures will be identical. Set base_ref to compare an older revision."
          fi
          revisions="previous ${base_sha:0:12} (${described}) vs updated ${head_sha:0:12} (${GITHUB_REF_NAME})"
          echo "sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "revisions=${revisions}" >> "$GITHUB_OUTPUT"
          echo "Figure review compares: ${revisions}" >> "$GITHUB_STEP_SUMMARY"
      - name: Create independent base checkout
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: git worktree add --detach "$RUNNER_TEMP/mdscope-base" "$BASE_SHA"
      - name: Render identical synthetic inputs with base and head renderers
        env:
          REVISIONS: ${{ steps.base.outputs.revisions }}
        run: |
          PYTHONPATH="$RUNNER_TEMP/mdscope-base/src" python scripts/plot_preview.py \
            --output "$RUNNER_TEMP/mdscope-plot-review/review/previous"
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/plot_preview.py \
            --output "$RUNNER_TEMP/mdscope-plot-review/current"
          python scripts/figure_gallery.py \
            --base "$RUNNER_TEMP/mdscope-plot-review/review/previous" \
            --head "$RUNNER_TEMP/mdscope-plot-review/current" \
            --output "$RUNNER_TEMP/mdscope-plot-review/review/index.html" \
            --revisions "$REVISIONS"
          # Deliberately probe the new allowlist: older base revisions
          # render extra figures, while plot-ID aware heads render only one.
          PYTHONPATH="$RUNNER_TEMP/mdscope-base/src" python scripts/plot_preview.py \
            --output "$RUNNER_TEMP/mdscope-plot-review/review/previous-selected" \
            --include time_series:rmsd_A:timeseries
          PYTHONPATH="$GITHUB_WORKSPACE/src" python scripts/plot_preview.py \
            --output "$RUNNER_TEMP/mdscope-plot-review/review/updated-selected" \
            --include time_series:rmsd_A:timeseries
          python scripts/figure_gallery.py \
            --base "$RUNNER_TEMP/mdscope-plot-review/review/previous-selected" \
            --head "$RUNNER_TEMP/mdscope-plot-review/review/updated-selected" \
            --output "$RUNNER_TEMP/mdscope-plot-review/review/selection/index.html" \
            --only-name rmsd_A__timeseries.png --revisions "$REVISIONS"
          python scripts/preview_gallery.py \
            --preview "$RUNNER_TEMP/mdscope-plot-review/current" \
            --output "$RUNNER_TEMP/mdscope-plot-review/index.html"
          # Retain numeric examples only for the current-condition preview.
          # Prior revision and selection outputs are developer comparisons:
          # their extra Parquet/CSV copies do not belong in a user-facing ZIP.
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "mdscope-plot-review"
          selected_name = "rmsd_A__timeseries.png"
          for relative in ("review/previous", "review/previous-selected",
                           "review/updated-selected"):
              folder = root / relative
              manifest = folder / "preview_manifest.json"
              record = json.loads(manifest.read_text())
              if relative.endswith("-selected"):
                  record["unselected_generated_plots"] = sum(
                      Path(name).name != selected_name for name in record["plots"])
                  record["plots"] = [
                      name for name in record["plots"]
                      if Path(name).name == selected_name
                  ]
              record.pop("table_previews", None)
              record.pop("table_inventory_csv", None)
              manifest.write_text(json.dumps(record, indent=2) + "\n")
              for file in folder.rglob("*"):
                  if not file.is_file() or file == manifest:
                      continue
                  if file.suffix == ".png" and (
                      not relative.endswith("-selected") or file.name == selected_name):
                      continue
                  file.unlink()
              for directory in sorted(
                      (p for p in folder.rglob("*") if p.is_dir()),
                      key=lambda p: len(p.parts), reverse=True):
                  if not any(directory.iterdir()):
                      directory.rmdir()
          (root / "README.txt").write_text(
              f"Compared: {__import__('os').environ['REVISIONS']}\n"
              "Start with index.html: one condition-centered preview, not a diff.\n"
              "current/: updated code's figures and synthetic numeric inputs.\n"
              "current/table_previews/table_inventory.csv: readable Parquet table index.\n"
              "review/index.html: previous vs updated *source-code* figures.\n"
              "review/selection/index.html: one requested plot and counts of extras.\n"
              "review/previous*, review/updated-selected: rendered revision examples,\n"
              "  not additional simulation conditions or independent datasets.\n"
              "All figures and data are SYNTHETIC EXAMPLES — NOT MD RESULTS.\n"
          )
          PY
      - name: Upload HTML and figure comparisons
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mdscope-figure-review
          path: ${{ runner.temp }}/mdscope-plot-review/
          if-no-files-found: warn
