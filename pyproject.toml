[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdscope"
version = "0.12.0"
description = "Reproducible molecular dynamics analysis workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "PyYAML",
    "matplotlib",
    "pypdf>=5",
    "MDAnalysis",
]

[project.optional-dependencies]
sasa = ["freesasa"]
studio = ["streamlit>=1.40,<2"]
test = ["pytest"]
dev = ["pytest", "build", "twine"]

[project.scripts]
mdscope = "mdscope.cli:main"
mdscope-studio = "mdscope.studio.launch:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["mdscope*"]
namespaces = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Blocking in CI: syntax errors and undefined names only. The full pyflakes
# set (F) runs as advisory annotations until existing findings are cleaned up.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not benchmark'"
markers = ["benchmark: optional numerical profiling, no wall-clock pass thresholds"]

