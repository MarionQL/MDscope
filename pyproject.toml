[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdscope"
version = "0.12.0"
description = "Reproducible molecular dynamics analysis workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "PyYAML",
    "matplotlib",
    "MDAnalysis",
]

[project.optional-dependencies]
sasa = ["freesasa"]
test = ["pytest"]
dev = ["pytest", "build", "twine"]

[project.scripts]
mdscope = "mdscope.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["mdscope*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not benchmark'"
markers = ["benchmark: optional numerical profiling, no wall-clock pass thresholds"]

