[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdscope"
# Single version source: src/mdscope/__init__.py (CITATION.cff is checked against it).
dynamic = ["version"]
description = "Reproducible molecular dynamics analysis workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marion LoPresti" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "pypdf>=5",
    "MDAnalysis>=2.8",
    "scipy>=1.11",
    "Pillow>=10.1",
]

[project.optional-dependencies]
sasa = ["freesasa"]
studio = ["streamlit>=1.40,<2"]
test = ["pytest"]
dev = ["pytest", "build", "twine"]

[project.urls]
Repository = "https://github.com/MarionQL/MDscope"
Issues = "https://github.com/MarionQL/MDscope/issues"
Documentation = "https://github.com/MarionQL/MDscope/tree/main/docs"

[project.scripts]
mdscope = "mdscope.cli:main"
mdscope-studio = "mdscope.studio.launch:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
"mdscope.studio" = ["assets/*.png"]

[tool.setuptools.dynamic]
version = { attr = "mdscope.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mdscope*"]
namespaces = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Blocking in CI: syntax errors plus the full pyflakes set (F). Keep
# intentional re-exports explicit (`import name as name`) instead of ignoring F401.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not benchmark'"
markers = ["benchmark: optional numerical profiling, no wall-clock pass thresholds"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "vulture>=2.16",
]

